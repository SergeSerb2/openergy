version = 1
role = "server"
name = "e2e-import"

[server]
listen = "127.0.0.1:65372"
port = 65372
heartbeat_ms = 3000

[client]
remote = ""
autoconnect = true
heartbeat_ms = 3000

[tls]
enabled = true
require_client_trust = true

[clipboard]
enabled = true
send = true
receive = true
max_bytes = 67108864

[input]
relative_mouse = false
invert_scroll_y = false
scroll_sensitivity = 1.0
sync_language = true
prevent_sleep = false

[switch]
delay_ms = 0
double_tap_ms = 0
dead_corners = []
corner_size_px = 0

[hotkeys]

[macos]
click_numbering = "native"

[[screen]]
name = "e2e-import"
aliases = []

[screen.links]
left = ""
right = ""
top = ""
bottom = ""
