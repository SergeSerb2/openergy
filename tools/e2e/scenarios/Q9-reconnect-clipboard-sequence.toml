# Requirement: Clipboard ownership serials belong to one server connection.
name = "Q9-reconnect-clipboard-sequence"
requirement = "After reconnect, a client uses sequence zero until the new server sends CINN."
timeout_ms = 2500

[[node]]
id = "server"
kind = "raw"
role = "server"

[[node]]
id = "client"
role = "client"
remote = "server"

[[step]]
do = "raw_send"
node = "server"
builder = "hello"

[[step]]
do = "raw_expect"
node = "server"
builder = "hello_back"
name = "client"

[[step]]
do = "raw_send"
node = "server"
builder = "code"
code = "QINF"

[[step]]
do = "raw_expect"
node = "server"
builder = "code"
code = "DINF"
payload_only = true
framed = true

[[step]]
do = "raw_send"
node = "server"
builder = "code"
code = "CIAK"

[[step]]
do = "raw_send"
node = "server"
builder = "options"
values = [1212240468, 0]

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "raw_send"
node = "server"
builder = "code"
code = "CINN"
payload_hex = "0014001e0000004d0000"

[[step]]
do = "clipboard_set"
node = "client"
text = "old session"

[[step]]
do = "raw_expect"
node = "server"
builder = "code"
code = "CCLP"
payload_hex = "000000004d"
payload_only = true
framed = true
scan = true

[[step]]
do = "restart"
node = "server"

[[step]]
do = "raw_send"
node = "server"
builder = "hello"

[[step]]
do = "raw_expect"
node = "server"
builder = "hello_back"
name = "client"

[[step]]
do = "raw_send"
node = "server"
builder = "code"
code = "QINF"

[[step]]
do = "raw_expect"
node = "server"
builder = "code"
code = "DINF"
payload_only = true
framed = true

[[step]]
do = "raw_send"
node = "server"
builder = "code"
code = "CIAK"

[[step]]
do = "raw_send"
node = "server"
builder = "options"
values = [1212240468, 0]

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "clipboard_set"
node = "client"
text = "new session"

[[step]]
do = "raw_expect"
node = "server"
builder = "code"
code = "CCLP"
payload_hex = "0000000000"
payload_only = true
framed = true
scan = true
