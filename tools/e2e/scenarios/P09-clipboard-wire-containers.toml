# Requirement: The real clipboard path preserves UTF-8 and binary formats and rejects invalid containers without losing the stream.
name = "P09-clipboard-wire-containers"
requirement = "DCLP containers preserve NUL and Unicode text, HTML and binary bytes, skip unknown formats, reject bad counts and lengths, and accept an empty clipboard."
timeout_ms = 3000

[[node]]
id = "server"
kind = "raw"
role = "server"

[[node]]
id = "client"
role = "client"
remote = "server"
platform = "virtual"
tls = false

