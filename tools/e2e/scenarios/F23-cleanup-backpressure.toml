# Requirement: staged-file cleanup survives worker backpressure.
name = "F23-cleanup-backpressure"
requirement = "A peer that bursts staged data frames and disconnects leaves no staged partial behind, even when the cleanup command cannot enter the bounded worker channel at first."
timeout_ms = 10000

[[node]]
id = "server"
role = "server"
tls = true
require_client_trust = true
config = { server = { heartbeat_ms = 3000 }, screen = [{ name = "server", rect = { x = 0, y = 0, w = 1920, h = 1080 } }, { name = "probe", rect = { x = 1920, y = 0, w = 1920, h = 1080 } }], file = { receive_mode = "auto", receive_dir = "${server.dir}/received", offer_timeout_ms = 8000 } }

[[node]]
id = "probe"
name = "probe"
kind = "raw"
role = "client"
remote = "server"
tls = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "hello"

[[step]]
do = "raw_send"
node = "probe"
builder = "hello_back"
name = "probe"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "QINF"
payload_only = true
framed = true

[[step]]
do = "raw_send"
node = "probe"
builder = "screen_info"

[[step]]
do = "wait_connected"
node = "server"
peer = "probe"

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "OFOF"
payload_hex = "00000001000000000962757273742e62696e00000000004000000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "OFAN"
payload_hex = "000000010100"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "OFTR"
payload_hex = "0000000101000000080000000000400000"

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "OFTR"
payload_hex = ""
repeat = 512

[[step]]
do = "stop"
node = "probe"

[[step]]
do = "sleep"
ms = 3000

[[step]]
do = "assert_file"
path = "${server.dir}/received/.parts/1"
exists = false
