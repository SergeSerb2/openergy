# Requirement: Down numbers exceed seed and strictly rise; drag/up reuse numbers and states; 1-2-3 clicks reset by distance and time.
name = "S18-click-numbering"
requirement = "Down numbers exceed seed and strictly rise; drag/up reuse numbers and states; 1-2-3 clicks reset by distance and time."
blocked_by = []
timeout_ms = 1800

[[node]]
id = "server"
kind = "openergy"
role = "server"
platform = "virtual"
tls = false

[[node]]
id = "client"
kind = "openergy"
role = "client"
platform = "virtual"
remote = "server"
tls = false

[[step]]
do = "wait_connected"
node = "client"
peer = "server"

[[step]]
do = "wait_connected"
node = "server"
peer = "client"

[[step]]
do = "set_screens"
node = "server"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "set_screens"
node = "client"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 1919, "y" = 540}, {"type" = "mouse_move_rel", "dx" = 20, "dy" = 0}]

[[step]]
do = "wait_status"
node = "server"
fields = {"active_screen" = "client"}

[[step]]
do = "inject"
node = "client"
events = []
seed = 1234
now_ms = 1000

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 100, "y" = 100}]

[[step]]
do = "inject"
node = "client"
events = []
seed = 1234
now_ms = 1000

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 100, "y" = 100}, {"type" = "mouse_down", "button" = 1}, {"type" = "mouse_move_abs", "x" = 101, "y" = 100}, {"type" = "mouse_up", "button" = 1}]

[[step]]
do = "inject"
node = "client"
events = []
seed = 1234
now_ms = 1100

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 101, "y" = 100}, {"type" = "mouse_down", "button" = 1}, {"type" = "mouse_move_abs", "x" = 102, "y" = 100}, {"type" = "mouse_up", "button" = 1}]

[[step]]
do = "inject"
node = "client"
events = []
seed = 1234
now_ms = 1200

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 100, "y" = 101}, {"type" = "mouse_down", "button" = 1}, {"type" = "mouse_move_abs", "x" = 101, "y" = 101}, {"type" = "mouse_up", "button" = 1}]

[[step]]
do = "inject"
node = "client"
events = []
seed = 1234
now_ms = 1300

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 200, "y" = 200}, {"type" = "mouse_down", "button" = 1}, {"type" = "mouse_move_abs", "x" = 201, "y" = 200}, {"type" = "mouse_up", "button" = 1}]

[[step]]
do = "inject"
node = "client"
events = []
seed = 1234
now_ms = 3000

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 200, "y" = 200}, {"type" = "mouse_down", "button" = 1}, {"type" = "mouse_move_abs", "x" = 201, "y" = 200}, {"type" = "mouse_up", "button" = 1}]

[[step]]
do = "inject"
node = "client"
events = []
seed = 1234
now_ms = 4000

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_down", "button" = 3}, {"type" = "mouse_move_abs", "x" = 210, "y" = 210}, {"type" = "mouse_up", "button" = 3}, {"type" = "mouse_down", "button" = 2}, {"type" = "mouse_move_abs", "x" = 211, "y" = 210}, {"type" = "mouse_up", "button" = 2}]

[[step]]
do = "assert_recorded_tail"
node = "client"
expect = [{"event" = {"type" = "mouse_down", "button" = 3}}, {"event" = {"type" = "mouse_move_abs", "x" = 210, "y" = 210}}, {"event" = {"type" = "mouse_up", "button" = 3}}, {"event" = {"type" = "mouse_down", "button" = 2}}, {"event" = {"type" = "mouse_move_abs", "x" = 211, "y" = 210}}, {"event" = {"type" = "mouse_up", "button" = 2}}]

[[step]]
do = "assert_numbering"
node = "client"
seed = 1234
min_downs = 7
states = [1, 2, 3, 1, 1, 1, 1]
