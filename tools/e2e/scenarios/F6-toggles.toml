# Requirement: F6 send/receive/enabled toggles and mid-transfer config change.
name = "F6-toggles"
requirement = "File toggles fail sends with typed errors; a mid-transfer disable cancels both sides."
timeout_ms = 15000

[[node]]
id = "server"
role = "server"
tls = true
require_client_trust = true
config = { file = { receive_mode = "auto", receive_dir = "${server.dir}/received", offer_timeout_ms = 5000 } }

[[node]]
id = "client"
role = "client"
remote = "server"
tls = true
config = { file = { receive_mode = "auto", receive_dir = "${client.dir}/received", offer_timeout_ms = 5000 } }

[[step]]
do = "subscribe"
node = "server"

[[step]]
do = "subscribe"
node = "client"

[[step]]
do = "wait_status"
node = "client"
fields = { "pending_trust" = { "$len" = 1 } }
save = "pc"

[[step]]
do = "ctl"
node = "client"
method = "trust.approve"
params = { fingerprint = "${pc.pending_trust.0.fingerprint}" }

[[step]]
do = "wait_status"
node = "server"
fields = { "pending_trust" = { "$len" = 1 } }
save = "ps"

[[step]]
do = "ctl"
node = "server"
method = "trust.approve"
params = { fingerprint = "${ps.pending_trust.0.fingerprint}" }

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "wait_connected"
node = "server"

[[step]]
do = "wait_status"
node = "server"
fields = { "peers.0.file.capability" = "openergy" }

[[step]]
do = "fixture_file"
path = "${server.dir}/toggle.bin"
bytes = 128
save = "f"

[[step]]
do = "config_patch"
node = "server"
patch = { file = { send = false } }

[[step]]
do = "file_send"
node = "server"
peer = "client"
path = "${server.dir}/toggle.bin"
expect_error = "file_disabled"

[[step]]
do = "config_patch"
node = "server"
patch = { file = { send = true } }

[[step]]
do = "config_patch"
node = "client"
patch = { file = { receive = false } }

[[step]]
do = "wait_status"
node = "server"
fields = { "peers.0.file.capability" = "none" }

[[step]]
do = "file_send"
node = "server"
peer = "client"
path = "${server.dir}/toggle.bin"
expect_error = "peer_no_file_support"

[[step]]
do = "config_patch"
node = "client"
patch = { file = { receive = true } }

[[step]]
do = "wait_status"
node = "server"
fields = { "peers.0.file.capability" = "openergy" }

[[step]]
do = "file_send"
node = "server"
peer = "client"
path = "${server.dir}/toggle.bin"

[[step]]
do = "wait_event"
node = "client"
event = "file.completed"
expect = { verified = true, bytes = 128 }

[[step]]
do = "fixture_file"
path = "${server.dir}/big.bin"
bytes = 33554432
save = "fb"

[[step]]
do = "file_send"
node = "server"
peer = "client"
path = "${server.dir}/big.bin"

[[step]]
do = "wait_event"
node = "client"
event = "file.progress"
expect = { direction = "in" }

[[step]]
do = "config_patch"
node = "client"
patch = { file = { enabled = false } }

[[step]]
do = "wait_event"
node = "client"
event = "file.failed"
expect = { reason = "disabled", direction = "in" }
timeout_ms = 15000

[[step]]
do = "wait_event"
node = "server"
event = "file.failed"
expect = { reason = "disabled", direction = "out" }
timeout_ms = 15000

[[step]]
do = "config_patch"
node = "client"
patch = { file = { enabled = true } }

[[step]]
do = "wait_status"
node = "server"
fields = { "peers.0.file.capability" = "openergy" }

[[step]]
do = "file_send"
node = "server"
peer = "client"
path = "${server.dir}/toggle.bin"

[[step]]
do = "wait_event"
node = "client"
event = "file.completed"
expect = { verified = true, bytes = 128 }

[[step]]
do = "assert_file"
path = "${client.dir}/received/toggle.bin"
sha256 = "${f.sha256}"
