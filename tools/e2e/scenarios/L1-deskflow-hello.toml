# Requirement: Pinned deskflow server emits documented hello bytes on assigned loopback port.
name = "L1-deskflow-hello"
requirement = "Pinned deskflow server emits documented hello bytes on assigned loopback port."
blocked_by = []
timeout_ms = 5000

[[node]]
id = "lab"
kind = "lab"
peer = "deskflow"
role = "server"
name = "lab"
screens = "lab,probe"

[[node]]
id = "probe"
kind = "raw"
role = "client"
remote = "lab"

[[step]]
do = "raw_expect"
node = "probe"
builder = "hello"
product = "Synergy"
minor = 8
