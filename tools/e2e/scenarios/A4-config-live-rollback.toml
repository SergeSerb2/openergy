name = "A4-config-live-rollback"
requirement = "An occupied replacement port preserves exact TOML, live config, and an existing connection."
timeout_ms = 3000

[[node]]
id = "server"
role = "server"
tls = false

[[node]]
id = "client"
role = "client"
remote = "server"
tls = false

[[node]]
id = "occupied"
kind = "raw"
role = "server"

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "wait_connected"
node = "server"

[[step]]
do = "assert_file"
path = "${server.config}"
save = "before"

[[step]]
do = "config_patch"
node = "server"
patch = {"server" = {"port" = "${occupied.port}"}}
expect_error = "config_apply_failed"

[[step]]
do = "assert_file"
path = "${server.config}"
sha256 = "${before.sha256}"

[[step]]
do = "assert_status"
node = "server"
fields = {"server.listen" = "127.0.0.1:${server.port}", "state" = "connected"}

[[step]]
do = "assert_status"
node = "client"
fields = {"state" = "connected"}
