# Requirement: Local and receiver clipboard caps emit clipboard.blocked, deliver no partial, and recover for a small clip.
name = "S10-clipboard-cap"
requirement = "Local and receiver clipboard caps emit clipboard.blocked, deliver no partial, and recover for a small clip."
blocked_by = []
timeout_ms = 1800

[[node]]
id = "server"
kind = "openergy"
role = "server"
platform = "virtual"
tls = false
config = {"clipboard" = {"max_bytes" = 1024}}

[[node]]
id = "client"
kind = "openergy"
role = "client"
platform = "virtual"
remote = "server"
tls = false

[[step]]
do = "wait_connected"
node = "client"
peer = "server"

[[step]]
do = "wait_connected"
node = "server"
peer = "client"

[[step]]
do = "subscribe"
node = "server"

[[step]]
do = "fixture_dib"
path = "${dir}/dib8.bin"
save = "dib"

[[step]]
do = "clipboard_set"
node = "server"
fixture = "${dib.path}"
kind = "dib"
encoding = "base64"

[[step]]
do = "set_screens"
node = "server"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "set_screens"
node = "client"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 1919, "y" = 540}, {"type" = "mouse_move_rel", "dx" = 20, "dy" = 0}]

[[step]]
do = "wait_status"
node = "server"
fields = {"active_screen" = "client"}

[[step]]
do = "wait_event"
node = "server"
event = "clipboard.blocked"
expect = {"limit" = 1024}

[[step]]
do = "assert_clipboard"
node = "client"
empty = true

[[step]]
do = "config_patch"
node = "server"
patch = {"clipboard" = {"max_bytes" = 67108864}}

[[step]]
do = "subscribe"
node = "client"

[[step]]
do = "config_patch"
node = "client"
patch = {"clipboard" = {"max_bytes" = 1024}}

[[step]]
do = "clipboard_set"
node = "server"
text = ""

[[step]]
do = "wait_event"
node = "client"
event = "clipboard.blocked"
expect = {"limit" = 1024}

[[step]]
do = "assert_clipboard"
node = "client"
empty = true

[[step]]
do = "clipboard_set"
node = "server"
text = "small"

[[step]]
do = "assert_clipboard"
node = "client"
text = "small"
