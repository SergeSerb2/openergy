# Requirement: Duplicate-name matrix: same TLS identity permits immediate replacement.
name = "S17-same-fingerprint"
requirement = "Duplicate-name matrix: same TLS identity permits immediate replacement."
blocked_by = ["WP4", "WP6"]
timeout_ms = 1800

[[node]]
id = "server"
kind = "openergy"
role = "server"
platform = "virtual"
tls = true

[[node]]
id = "client"
kind = "openergy"
role = "client"
platform = "virtual"
remote = "server"
tls = true

[[node]]
id = "newcomer"
kind = "openergy"
role = "client"
platform = "virtual"
name = "client"
remote = "server"
tls = true
autostart = false

[[step]]
do = "wait_status"
node = "client"
fields = {"pending_trust" = {"$len" = 1}}
save = "pending"

[[step]]
do = "ctl"
node = "client"
method = "trust.approve"
params = {"fingerprint" = "${pending.pending_trust.0.fingerprint}"}

[[step]]
do = "wait_connected"
node = "client"
peer = "server"

[[step]]
do = "wait_connected"
node = "server"
peer = "client"

[[step]]
do = "copy_identity"
node = "newcomer"
source = "client"

[[step]]
do = "start"
node = "newcomer"

[[step]]
do = "wait_connected"
node = "newcomer"

[[step]]
do = "wait_status"
node = "server"
fields = {"peers" = {"$len" = 1}}
