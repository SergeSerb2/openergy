# Requirement: Keys without a physical button ID still have distinct release records.
name = "Q8-zero-button-key-release"
requirement = "Every held zero-button key receives its own DKUP before COUT on a live configuration leave."
timeout_ms = 1200

[[node]]
id = "server"
role = "server"
config = { screen = [{ name = "server", rect = { x = 0, y = 0, w = 1920, h = 1080 } }, { name = "client", rect = { x = 1920, y = 0, w = 1920, h = 1080 } }] }

[[node]]
id = "probe"
kind = "raw"
role = "client"
remote = "server"
name = "client"

[[step]]
do = "raw_expect"
node = "probe"
builder = "hello"

[[step]]
do = "raw_send"
node = "probe"
builder = "hello_back"
name = "client"

[[step]]
do = "raw_send"
node = "probe"
builder = "screen_info"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DSOP"
payload_only = true
framed = true
scan = true

[[step]]
do = "inject"
node = "server"
events = [{ type = "mouse_move_abs", x = 1919, y = 540 }, { type = "mouse_move_rel", dx = 20, dy = 0 }]

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "CINN"
payload_only = true
framed = true
scan = true

[[step]]
do = "inject"
node = "server"
events = [{ type = "key_down", key = 97, modifiers = 0, button = 0 }, { type = "key_down", key = 98, modifiers = 0, button = 0 }]

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DKDN"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DKDN"
payload_only = true
framed = true
scan = true

[[step]]
do = "config_patch"
node = "server"
patch = { input = { scroll_sensitivity = 1.25 } }

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DKUP"
payload_hex = "006100000000"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DKUP"
payload_hex = "006200000000"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "COUT"
payload_only = true
framed = true
scan = true
