# Requirement: F9 receiver killed mid-transfer; restart sweeps partials.
name = "F9-receiver-killed"
requirement = "Killing the receiver fails the sender; a restart has no staged state and accepts new sends."
timeout_ms = 15000

[[node]]
id = "server"
role = "server"
tls = true
require_client_trust = true
config = { file = { receive_mode = "auto", receive_dir = "${server.dir}/received", offer_timeout_ms = 5000 } }

[[node]]
id = "client"
role = "client"
remote = "server"
tls = true
config = { file = { receive_mode = "auto", receive_dir = "${client.dir}/received", offer_timeout_ms = 5000 } }

[[step]]
do = "subscribe"
node = "server"

[[step]]
do = "subscribe"
node = "client"

[[step]]
do = "wait_status"
node = "client"
fields = { "pending_trust" = { "$len" = 1 } }
save = "pc"

[[step]]
do = "ctl"
node = "client"
method = "trust.approve"
params = { fingerprint = "${pc.pending_trust.0.fingerprint}" }

[[step]]
do = "wait_status"
node = "server"
fields = { "pending_trust" = { "$len" = 1 } }
save = "ps"

[[step]]
do = "ctl"
node = "server"
method = "trust.approve"
params = { fingerprint = "${ps.pending_trust.0.fingerprint}" }

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "wait_connected"
node = "server"

[[step]]
do = "wait_status"
node = "server"
fields = { "peers.0.file.capability" = "openergy" }

[[step]]
do = "fixture_file"
path = "${server.dir}/big.bin"
bytes = 8388608
save = "f"

[[step]]
do = "file_send"
node = "server"
peer = "client"
path = "${server.dir}/big.bin"

[[step]]
do = "wait_event"
node = "client"
event = "file.progress"
expect = { direction = "in" }
save = "prog"

[[step]]
do = "assert_file"
path = "${client.dir}/received/.parts/${prog.data.xfer}"
exists = true

[[step]]
do = "kill"
node = "client"
signal = "KILL"

[[step]]
do = "wait_event"
node = "server"
event = "file.failed"
expect = { direction = "out" }
timeout_ms = 20000

[[step]]
do = "restart"
node = "client"
force = true

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "wait_status"
node = "client"
fields = { "file.active" = { "$len" = 0 } }

[[step]]
do = "assert_file"
path = "${client.dir}/received/.parts/${prog.data.xfer}"
exists = false

[[step]]
do = "assert_file"
path = "${client.dir}/received/big.bin"
exists = false

[[step]]
do = "subscribe"
node = "client"

[[step]]
do = "file_send"
node = "server"
peer = "client"
path = "${server.dir}/big.bin"

[[step]]
do = "wait_event"
node = "client"
event = "file.completed"
expect = { verified = true, bytes = 8388608 }
timeout_ms = 60000

[[step]]
do = "assert_file"
path = "${client.dir}/received/big.bin"
sha256 = "${f.sha256}"
