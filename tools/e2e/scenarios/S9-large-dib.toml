# Requirement: 8 MiB DIB pixels plus 40-byte header retain SHA-256; typing arrives before transfer completion.
name = "S9-large-dib"
requirement = "8 MiB DIB pixels plus 40-byte header retain SHA-256; typing arrives before transfer completion."
blocked_by = ["WP3", "WP6"]
timeout_ms = 1800

[[node]]
id = "server"
kind = "openergy"
role = "server"
platform = "virtual"
tls = false

[[node]]
id = "client"
kind = "openergy"
role = "client"
platform = "virtual"
remote = "server"
tls = false

[[step]]
do = "wait_connected"
node = "client"
peer = "server"

[[step]]
do = "wait_connected"
node = "server"
peer = "client"

[[step]]
do = "fixture_dib"
path = "${dir}/dib8.bin"
save = "dib"

[[step]]
do = "clipboard_set"
node = "server"
fixture = "${dib.path}"
kind = "dib"
encoding = "base64"

[[step]]
do = "set_screens"
node = "server"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "set_screens"
node = "client"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 1919, "y" = 540}, {"type" = "mouse_move_rel", "dx" = 20, "dy" = 0}]

[[step]]
do = "wait_status"
node = "server"
fields = {"active_screen" = "client"}

[[step]]
do = "inject"
node = "server"
events = [{"type" = "key_down", "key" = 97, "modifiers" = 1, "button" = 1}, {"type" = "key_up", "key" = 97, "modifiers" = 1, "button" = 1}]

[[step]]
do = "assert_recorded"
node = "client"
expect = [{"event" = {"type" = "key_down", "key" = 97, "modifiers" = 1, "button" = 1}}, {"event" = {"type" = "key_up", "key" = 97, "modifiers" = 1, "button" = 1}}]

[[step]]
do = "wait_status"
node = "client"
fields = {"clipboard.last_transfer.bytes" = {"$ne" = 8388648}}
timeout_ms = 500

[[step]]
do = "assert_clipboard"
node = "client"
kind = "dib"
sha256 = "${dib.sha256}"
bytes = 8388648
timeout_ms = 15000
