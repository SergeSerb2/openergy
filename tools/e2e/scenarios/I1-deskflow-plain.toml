# Requirement: Openergy virtual client connects to pinned deskflow server, TLS False, and remains connected across heartbeats.
name = "I1-deskflow-plain"
requirement = "Openergy virtual client connects to pinned deskflow server, TLS False, and remains connected across heartbeats."
blocked_by = []
timeout_ms = 5000

[[node]]
id = "lab"
kind = "lab"
peer = "deskflow"
role = "server"
name = "lab"
screens = "lab,client"
tls = false

[[node]]
id = "client"
kind = "openergy"
role = "client"
platform = "virtual"
remote = "lab"
tls = false

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "sleep"
ms = 30000

[[step]]
do = "wait_connected"
node = "client"
