# Requirement: An established connection must reject a three-byte frame from the prefix alone.
name = "P02-short-established-frame"
requirement = "Reject a message too short for a code without waiting for another frame or the heartbeat timeout."
timeout_ms = 3000

[[node]]
id = "server"
role = "server"
platform = "virtual"
config = { server = { heartbeat_ms = 3000 }, screen = [{ name = "server", rect = { x = 0, y = 0, w = 1920, h = 1080 } }, { name = "probe", rect = { x = 1920, y = 0, w = 1920, h = 1080 } }] }

[[node]]
id = "probe"
name = "probe"
kind = "raw"
role = "client"
remote = "server"

[[step]]
do = "raw_expect"
node = "probe"
builder = "hello"

[[step]]
do = "raw_send"
node = "probe"
builder = "hello_back"
name = "probe"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "QINF"
payload_only = true
framed = true

[[step]]
do = "raw_send"
node = "probe"
builder = "screen_info"

[[step]]
do = "wait_connected"
node = "server"
peer = "probe"

[[step]]
do = "raw_send"
node = "probe"
hex = "00000003"

[[step]]
do = "raw_expect_closed"
node = "probe"
timeout_ms = 500

[[step]]
do = "wait_status"
node = "server"
fields = { role = "server" }
