name = "A3-heartbeat-close-flush"
requirement = "A raw peer sees ordinary DKDN, matching release ups and COUT before FIN on heartbeat death."
timeout_ms = 3000

[[node]]
id = "server"
role = "server"
tls = false
config = {"server" = {"heartbeat_ms" = 500}, "screen" = [{"name" = "server", "rect" = {"x" = 0, "y" = 0, "w" = 1920, "h" = 1080}}, {"name" = "client", "rect" = {"x" = 1920, "y" = 0, "w" = 1920, "h" = 1080}}]}

[[node]]
id = "probe"
kind = "raw"
role = "client"
remote = "server"
name = "client"

[[step]]
do = "raw_expect"
node = "probe"
builder = "hello"

[[step]]
do = "raw_send"
node = "probe"
builder = "hello_back"
name = "client"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "QINF"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_send"
node = "probe"
builder = "screen_info"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DSOP"
payload_only = true
framed = true
scan = true

[[step]]
do = "wait_connected"
node = "server"

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 1919, "y" = 540}, {"type" = "mouse_move_rel", "dx" = 20, "dy" = 0}]

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "CINN"
payload_only = true
framed = true
scan = true

[[step]]
do = "inject"
node = "server"
events = [{"type" = "key_down", "key" = 97, "modifiers" = 0, "button" = 4}, {"type" = "mouse_down", "button" = 1}]

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DKDN"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DMDN"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DKUP"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DMUP"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "COUT"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_expect_closed"
node = "probe"
