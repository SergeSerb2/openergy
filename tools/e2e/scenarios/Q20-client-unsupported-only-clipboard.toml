# Requirement: A nonempty unsupported-only wire container must not become a clipboard clear.
name = "Q20-client-unsupported-only-clipboard"
requirement = "Preserve receiver text for unsupported-only data, accept supported plus unknown formats, and retain a genuine count-zero clear."
timeout_ms = 1400

[[node]]
id = "wire-server"
kind = "raw"
role = "server"

[[node]]
id = "client"
role = "client"
remote = "wire-server"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "hello"

[[step]]
do = "raw_expect"
node = "wire-server"
builder = "hello_back"
name = "client"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "QINF"
payload_hex = ""

[[step]]
do = "raw_expect"
node = "wire-server"
builder = "code"
code = "DINF"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "CIAK"
payload_hex = ""

[[step]]
do = "raw_send"
node = "wire-server"
builder = "options"
values = [1212240468, 0]

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "clipboard_set"
node = "client"
text = "keep-me!"

[[step]]
do = "assert_clipboard"
node = "client"
text = "keep-me!"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "000000000001000000023135"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "0000000000020000000f00000001000000630000000378797a"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "00000000000300000000"

[[step]]
do = "sleep"
ms = 150

[[step]]
do = "assert_clipboard"
node = "client"
text = "keep-me!"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "000000000001000000023238"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "0000000000020000001c00000002000000630000000378797a00000000000000056d69786564"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "00000000000300000000"

[[step]]
do = "assert_clipboard"
node = "client"
text = "mixed"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "000000000001000000023233"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "0000000000020000001700000002000000630000000378797a0000000000000000"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "00000000000300000000"

[[step]]
do = "assert_clipboard"
node = "client"
text = ""

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "0000000000010000000134"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "0000000000020000000400000000"

[[step]]
do = "raw_send"
node = "wire-server"
builder = "code"
code = "DCLP"
payload_hex = "00000000000300000000"

[[step]]
do = "assert_clipboard"
node = "client"
empty = true
