name = "A6-clipboard-backpressure"
requirement = "A real stopped reader fills the bounded Bulk queue; transfer abort is visible while IPC stays responsive."
timeout_ms = 3000

[[node]]
id = "server"
role = "server"
tls = false
config = {"server" = {"heartbeat_ms" = 3000}, "screen" = [{"name" = "server", "rect" = {"x" = 0, "y" = 0, "w" = 1920, "h" = 1080}}, {"name" = "client", "rect" = {"x" = 1920, "y" = 0, "w" = 1920, "h" = 1080}}]}

[[node]]
id = "probe"
kind = "raw"
role = "client"
remote = "server"
name = "client"

[[step]]
do = "raw_expect"
node = "probe"
builder = "hello"

[[step]]
do = "raw_send"
node = "probe"
builder = "hello_back"
name = "client"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "QINF"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_send"
node = "probe"
builder = "screen_info"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DSOP"
payload_only = true
framed = true
scan = true

[[step]]
do = "wait_connected"
node = "server"

[[step]]
do = "ctl"
node = "server"
method = "virtual.clipboard"
params = {"dib_bytes" = 8388608}

[[step]]
do = "wait_status"
node = "server"
fields = {"clipboard.last_blocked.unix_ms" = {"$gte" = 1}, "last_error.code" = "clipboard_queue_full"}
timeout_ms = 6000
