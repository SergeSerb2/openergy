# Requirement: F24 a symlinked staging directory is refused.
name = "F24-symlinked-parts"
requirement = "A .parts symlink planted inside a custom receive directory is never followed: the startup sweep does not delete the target's files and receives into it are rejected."
timeout_ms = 10000

[[node]]
id = "server"
role = "server"
tls = true
require_client_trust = true
config = { file = { receive_mode = "auto", receive_dir = "${server.dir}/received", offer_timeout_ms = 5000 } }

[[node]]
id = "client"
role = "client"
remote = "server"
tls = true
autostart = false
config = { file = { receive_mode = "auto", receive_dir = "${client.dir}/shared", offer_timeout_ms = 5000 } }

[[step]]
do = "write_file"
path = "${client.dir}/victim/keep.txt"
text = "keep"

[[step]]
do = "write_file"
path = "${client.dir}/shared/marker.txt"
text = "shared"

[[step]]
do = "symlink"
path = "${client.dir}/shared/.parts"
target = "${client.dir}/victim"

[[step]]
do = "start"
node = "client"

[[step]]
do = "subscribe"
node = "server"

[[step]]
do = "subscribe"
node = "client"

[[step]]
do = "assert_file"
path = "${client.dir}/victim/keep.txt"

[[step]]
do = "wait_status"
node = "client"
fields = { "pending_trust" = { "$len" = 1 } }
save = "pc"

[[step]]
do = "ctl"
node = "client"
method = "trust.approve"
params = { fingerprint = "${pc.pending_trust.0.fingerprint}" }

[[step]]
do = "wait_status"
node = "server"
fields = { "pending_trust" = { "$len" = 1 } }
save = "ps"

[[step]]
do = "ctl"
node = "server"
method = "trust.approve"
params = { fingerprint = "${ps.pending_trust.0.fingerprint}" }

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "wait_connected"
node = "server"

[[step]]
do = "wait_status"
node = "server"
fields = { "peers.0.file.capability" = "openergy" }

[[step]]
do = "fixture_file"
path = "${server.dir}/link.bin"
bytes = 128

[[step]]
do = "file_send"
node = "server"
peer = "client"
path = "${server.dir}/link.bin"

[[step]]
do = "wait_event"
node = "server"
event = "file.failed"
expect = { reason = "io_error", direction = "out" }

[[step]]
do = "assert_file"
path = "${client.dir}/victim/keep.txt"

[[step]]
do = "assert_file"
path = "${client.dir}/shared/link.bin"
exists = false

[[step]]
do = "assert_file"
path = "${client.dir}/victim/link.bin"
exists = false
