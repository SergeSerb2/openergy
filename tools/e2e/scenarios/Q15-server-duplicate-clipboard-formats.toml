# Requirement: Reject duplicate clipboard formats before calling a backend.
name = "Q15-server-duplicate-clipboard-formats"
requirement = "Duplicate wire format IDs cause no clipboard update, transfer notice, or backend error; the next valid transfer succeeds."
timeout_ms = 1200

[[node]]
id = "server"
role = "server"
config = { screen = [{ name = "server", rect = { x = 0, y = 0, w = 1920, h = 1080 } }, { name = "client", rect = { x = 1920, y = 0, w = 1920, h = 1080 } }] }

[[node]]
id = "probe"
kind = "raw"
role = "client"
remote = "server"
name = "client"

[[step]]
do = "raw_expect"
node = "probe"
builder = "hello"

[[step]]
do = "raw_send"
node = "probe"
builder = "hello_back"
name = "client"

[[step]]
do = "raw_send"
node = "probe"
builder = "screen_info"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "DSOP"
payload_only = true
framed = true
scan = true

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "CCLP"
payload_hex = "0000000000"

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "DCLP"
payload_hex = "000000000001000000023232"

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "DCLP"
payload_hex = "0000000000020000001600000002000000000000000161000000000000000162"

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "DCLP"
payload_hex = "00000000000300000000"

[[step]]
do = "sleep"
ms = 200

[[step]]
do = "assert_clipboard"
node = "server"
empty = true

[[step]]
do = "assert_status"
node = "server"
fields = { "clipboard.last_transfer" = { "$null" = true }, last_error = { "$null" = true } }

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "CCLP"
payload_hex = "0000000000"

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "DCLP"
payload_hex = "000000000001000000023137"

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "DCLP"
payload_hex = "000000000002000000110000000100000000000000056672657368"

[[step]]
do = "raw_send"
node = "probe"
builder = "code"
code = "DCLP"
payload_hex = "00000000000300000000"

[[step]]
do = "assert_clipboard"
node = "server"
text = "fresh"

