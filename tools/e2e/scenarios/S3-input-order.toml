# Requirement: Modifier keys, repeats, buttons and horizontal-first Deskflow wheel units arrive in order.
name = "S3-input-order"
requirement = "Modifier keys, repeats, buttons and horizontal-first Deskflow wheel units arrive in order."
blocked_by = ["WP6"]
timeout_ms = 1800

[[node]]
id = "server"
kind = "openergy"
role = "server"
platform = "virtual"
tls = false

[[node]]
id = "client"
kind = "openergy"
role = "client"
platform = "virtual"
remote = "server"
tls = false

[[step]]
do = "wait_connected"
node = "client"
peer = "server"

[[step]]
do = "wait_connected"
node = "server"
peer = "client"

[[step]]
do = "set_screens"
node = "server"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "set_screens"
node = "client"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 1919, "y" = 540}, {"type" = "mouse_move_rel", "dx" = 20, "dy" = 0}]

[[step]]
do = "wait_status"
node = "server"
fields = {"active_screen" = "client"}

[[step]]
do = "ledger_mark"
node = "client"
save = "before"

[[step]]
do = "inject"
node = "server"
events = [{"type" = "key_down", "key" = 97, "modifiers" = 1, "button" = 1}, {"type" = "key_repeat", "key" = 97, "modifiers" = 1, "count" = 2, "button" = 1}, {"type" = "key_up", "key" = 97, "modifiers" = 1, "button" = 1}, {"type" = "mouse_down", "button" = 1}, {"type" = "mouse_up", "button" = 1}, {"type" = "mouse_wheel", "dx" = 120, "dy" = -240}]

[[step]]
do = "assert_recorded"
node = "client"
expect = [{"event" = {"type" = "key_down", "key" = 97, "modifiers" = 1, "button" = 1}}, {"event" = {"type" = "key_repeat", "key" = 97, "modifiers" = 1, "count" = 2, "button" = 1}}, {"event" = {"type" = "key_up", "key" = 97, "modifiers" = 1, "button" = 1}}, {"event" = {"type" = "mouse_down", "button" = 1}}, {"event" = {"type" = "mouse_up", "button" = 1}}, {"event" = {"type" = "mouse_wheel", "dx" = 120, "dy" = -240}}]
since = "${before.sequence}"
exact = true
