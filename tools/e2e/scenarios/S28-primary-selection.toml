# Requirement: Opt-in PRIMARY (clipboard id 1) travels independently of CLIPBOARD (id 0) in both directions.
name = "S28-primary-selection"
requirement = "With share_primary_selection on, PRIMARY text moves server->client and client->server without touching id 0; with the flag patched off on the server, PRIMARY stops moving in both directions."
timeout_ms = 8000

[[node]]
id = "server"
role = "server"
config = { clipboard = { share_primary_selection = true }, screen = [{ name = "server", rect = { x = 0, y = 0, w = 1920, h = 1080 } }, { name = "client", os = "linux", rect = { x = 1920, y = 0, w = 1920, h = 1080 } }, { name = "client3", os = "linux", rect = { x = 1920, y = 1080, w = 1920, h = 1080 } }] }

[[node]]
id = "client"
role = "client"
remote = "server"
config = { clipboard = { share_primary_selection = true } }

# Late joiner for the owner-exit phase: starts only after the server's
# PRIMARY owner has exited, proving the server kept the last selection.
[[node]]
id = "client3"
role = "client"
remote = "server"
config = { clipboard = { share_primary_selection = true } }
autostart = false

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "wait_connected"
node = "server"

[[step]]
do = "wait_status"
node = "server"
fields = { "clipboard.primary_enabled" = true }

[[step]]
do = "clipboard_set"
node = "server"
text = "clipboard zero"

[[step]]
do = "assert_clipboard"
node = "client"
text = "clipboard zero"

# Server -> client PRIMARY. The client screen is configured os = "linux" on
# the server, so the relay rule admits id 1 before the client ever sends one.
# The PRIMARY change must not re-send the unchanged CLIPBOARD: the only
# clipboard write the client records in this window is the id 1 write.
[[step]]
do = "ledger_mark"
node = "client"
audit = true
save = "pre_primary"

[[step]]
do = "clipboard_set"
node = "server"
selection = "primary"
text = "primary from server"

[[step]]
do = "assert_clipboard"
node = "client"
selection = "primary"
text = "primary from server"

[[step]]
do = "sleep"
ms = 200

[[step]]
do = "assert_recorded"
node = "client"
since = "${pre_primary.sequence}"
exact = true
audit = true
expect = [{"detail" = {"kind" = "primary_clipboard_write"}}]

[[step]]
do = "assert_clipboard"
node = "client"
text = "clipboard zero"

# Client -> server PRIMARY, again leaving id 0 untouched.
[[step]]
do = "clipboard_set"
node = "client"
selection = "primary"
text = "primary from client"

[[step]]
do = "assert_clipboard"
node = "server"
selection = "primary"
text = "primary from client"

[[step]]
do = "assert_clipboard"
node = "server"
text = "clipboard zero"

# Owner exit on the server: the local PRIMARY read comes back empty.
# That is not a clear — nothing may be sent, and the server must keep
# the peer-owned selection it is relaying for peers that connect later.
[[step]]
do = "ledger_mark"
node = "client"
audit = true
save = "pre_exit"

[[step]]
do = "clipboard_set"
node = "server"
selection = "primary"
formats = []

[[step]]
do = "sleep"
ms = 300

[[step]]
do = "assert_recorded"
node = "client"
since = "${pre_exit.sequence}"
exact = true
audit = true
expect = []

[[step]]
do = "start"
node = "client3"

[[step]]
do = "wait_connected"
node = "client3"

[[step]]
do = "assert_clipboard"
node = "client3"
selection = "primary"
text = "primary from client"

[[step]]
do = "assert_clipboard"
node = "client3"
text = "clipboard zero"

# Flag off on the server: its local PRIMARY must not leave, and PRIMARY
# arriving from the still-enabled client must be dropped at the server.
[[step]]
do = "config_patch"
node = "server"
patch = { clipboard = { share_primary_selection = false } }

[[step]]
do = "wait_status"
node = "server"
fields = { "clipboard.primary_enabled" = false }

[[step]]
do = "clipboard_set"
node = "server"
selection = "primary"
text = "must not travel"

[[step]]
do = "clipboard_set"
node = "client"
selection = "primary"
text = "must be dropped"

[[step]]
do = "sleep"
ms = 800

[[step]]
do = "assert_clipboard"
node = "client"
selection = "primary"
text = "must be dropped"

[[step]]
do = "assert_clipboard"
node = "server"
selection = "primary"
text = "must not travel"
