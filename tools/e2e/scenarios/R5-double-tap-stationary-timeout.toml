# Requirement: A stationary edge hold cannot create new double-tap hits.
name = "R5-double-tap-stationary-timeout"
requirement = "After holding the first edge hit beyond the double-tap window, a second physical hit starts a new pair and only a third timely hit switches."
timeout_ms = 1200

[[node]]
id = "server"
role = "server"
config = { switch = { double_tap_ms = 400 } }

[[node]]
id = "client"
role = "client"
remote = "server"

[[step]]
do = "wait_connected"
node = "client"

[[step]]
do = "wait_connected"
node = "server"

[[step]]
do = "inject"
node = "server"
events = [{ type = "mouse_move_abs", x = 1919, y = 540 }]

# Both hits are more than 400ms apart. A timer must not renew the first hit.
[[step]]
do = "sleep"
ms = 650

[[step]]
do = "inject"
node = "server"
events = [{ type = "mouse_move_abs", x = 1800, y = 540 }]

[[step]]
do = "assert_status"
node = "server"
fields = { active_screen = "server", "cursor.x" = 1800 }

[[step]]
do = "inject"
node = "server"
events = [{ type = "mouse_move_abs", x = 1919, y = 540 }]

[[step]]
do = "sleep"
ms = 60

[[step]]
do = "assert_status"
node = "server"
fields = { active_screen = "server" }
timeout_ms = 100

[[step]]
do = "inject"
node = "server"
events = [{ type = "mouse_move_abs", x = 1800, y = 540 }]

[[step]]
do = "assert_status"
node = "server"
fields = { active_screen = "server", "cursor.x" = 1800 }

[[step]]
do = "inject"
node = "server"
events = [{ type = "mouse_move_abs", x = 1919, y = 540 }]

[[step]]
do = "wait_status"
node = "server"
fields = { active_screen = "client" }

[[step]]
do = "inject"
node = "server"
events = [{ type = "key_down", key = 97, modifiers = 0, button = 4 }, { type = "key_up", key = 97, modifiers = 0, button = 4 }]

[[step]]
do = "assert_recorded"
node = "client"
expect = [{ event = { type = "key_down", key = 97 } }, { event = { type = "key_up", key = 97 } }]
