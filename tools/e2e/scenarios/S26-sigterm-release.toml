# Requirement: SIGTERM to the server releases a held key on the client and the server exits zero.
name = "S26-sigterm-release"
requirement = "SIGTERM to the server releases a held key on the client and the server exits zero."
blocked_by = []
timeout_ms = 2500

[[node]]
id = "server"
kind = "openergy"
role = "server"
platform = "virtual"
tls = false

[[node]]
id = "client"
kind = "openergy"
role = "client"
platform = "virtual"
remote = "server"
tls = false

[[step]]
do = "wait_connected"
node = "client"
peer = "server"

[[step]]
do = "wait_connected"
node = "server"
peer = "client"

[[step]]
do = "set_screens"
node = "server"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "set_screens"
node = "client"
rects = [{"x" = 0, "y" = 0, "w" = 1920, "h" = 1080, "scale" = 1.0}]

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 1919, "y" = 540}, {"type" = "mouse_move_rel", "dx" = 20, "dy" = 0}]

[[step]]
do = "wait_status"
node = "server"
fields = {"active_screen" = "client"}

[[step]]
do = "inject"
node = "server"
events = [{"type" = "key_down", "key" = 97, "modifiers" = 1, "button" = 1}]

[[step]]
do = "assert_recorded"
node = "client"
expect = [{"event" = {"type" = "key_down", "key" = 97, "modifiers" = 1, "button" = 1}}]

[[step]]
do = "kill"
node = "server"
signal = "TERM"

[[step]]
do = "assert_recorded_tail"
node = "client"
expect = [{"event" = {"type" = "key_up", "key" = 97, "modifiers" = 1, "button" = 1}}, {"release_all" = true}]
timeout_ms = 5000

[[step]]
do = "ctl"
node = "client"
method = "virtual.recorded"
fields = {"stats.pressed_keys" = 0, "stats.pressed_buttons" = 0}

[[step]]
do = "wait_status"
node = "client"
fields = {"state" = "reconnecting"}

[[step]]
do = "wait_exit"
node = "server"
code = 0
timeout_ms = 5000
