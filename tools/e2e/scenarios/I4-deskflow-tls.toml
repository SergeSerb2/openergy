# Requirement: Openergy virtual server sends ordered typing/clicks to the real Docker deskflow client; server death permits clean later input.
name = "I4-deskflow-tls"
requirement = "Openergy virtual server sends ordered typing/clicks to the real Docker deskflow client; server death permits clean later input."
blocked_by = []
timeout_ms = 5000

[[node]]
id = "server"
kind = "openergy"
role = "server"
platform = "virtual"
tls = true

[[node]]
id = "lab"
kind = "lab"
peer = "deskflow"
role = "client"
name = "lab"
remote = "server"
tls = true
autostart = false

[[step]]
do = "cli"
node = "server"
args = ["fingerprint", "--synergy", "--config", "${server.config}"]
save = "fp"

[[step]]
do = "set_lab_trust"
node = "lab"
fingerprint = "${fp.stdout}"

[[step]]
do = "start"
node = "lab"

[[step]]
do = "wait_connected"
node = "server"
peer = "lab"

[[step]]
do = "lab_ctl"
node = "lab"
args = ["events", "start"]

[[step]]
do = "inject"
node = "server"
events = [{"type" = "mouse_move_abs", "x" = 1919, "y" = 540}, {"type" = "mouse_move_rel", "dx" = 20, "dy" = 0}, {"type" = "mouse_down", "button" = 1}, {"type" = "mouse_up", "button" = 1}, {"type" = "key_down", "key" = 97, "modifiers" = 1, "button" = 1}, {"type" = "key_up", "key" = 97, "modifiers" = 1, "button" = 1}]

[[step]]
do = "lab_events_dump"
node = "lab"
regex = "ButtonPress"

[[step]]
do = "lab_events_dump"
node = "lab"
regex = "KeyPress"

[[step]]
do = "kill"
node = "server"
signal = "KILL"

[[step]]
do = "stop"
node = "server"
force = true

[[step]]
do = "start"
node = "server"

[[step]]
do = "wait_connected"
node = "server"
peer = "lab"
