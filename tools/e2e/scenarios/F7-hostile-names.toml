# Requirement: F7 hostile names from a verified wire peer.
name = "F7-hostile-names"
requirement = "Unsafe offered names are rejected; safe names store exactly inside the receive dir."
timeout_ms = 10000

[[node]]
id = "server"
role = "server"
tls = true
require_client_trust = true
config = { server = { heartbeat_ms = 3000 }, screen = [{ name = "server", rect = { x = 0, y = 0, w = 1920, h = 1080 } }, { name = "probe", rect = { x = 1920, y = 0, w = 1920, h = 1080 } }], file = { receive_mode = "auto", receive_dir = "${server.dir}/received", offer_timeout_ms = 8000 } }

[[node]]
id = "probe"
name = "probe"
kind = "raw"
role = "client"
remote = "server"
tls = true

[[step]]
do = "raw_expect"
node = "probe"
builder = "hello"

[[step]]
do = "raw_send"
node = "probe"
builder = "hello_back"
name = "probe"

[[step]]
do = "raw_expect"
node = "probe"
builder = "code"
code = "QINF"
payload_only = true
framed = true

[[step]]
do = "raw_send"
node = "probe"
builder = "screen_info"

[[step]]
do = "wait_connected"
node = "server"
peer = "probe"

