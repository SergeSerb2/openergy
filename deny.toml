[advisories]
version = 2
# A public release must not silently accept a yanked dependency.
yanked = "deny"
[licenses]
version = 2
# Audit the source-distributed development tools as well as shipped code.
include-dev = true
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
