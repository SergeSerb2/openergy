<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Openergy vs Synergy on macOS</title>
<desc id="chart-desc">App bundle on disk (du -sk): Openergy 0.1 alpha 9.1 MiB. App bundle on disk (du -sk): Synergy 3.7 beta 524.4 MiB. Idle memory (RSS), connected client: Openergy 0.1 alpha 64.5 MiB. Idle memory (RSS), connected client: Synergy 3.7 beta 144.3 MiB.</desc>
<style>
  .t1 { fill: #f0f6fc; }
  .t2 { fill: #9198a1; }
  .rule { stroke: #3d444d; }
  .s-openergy { fill: #3987e5; }
  .s-synergy { fill: #d95926; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 600; }
  .sub { font-size: 12px; }
  .head { font-size: 13px; font-weight: 600; }
  .cat { font-size: 13px; }
  .val { font-size: 13px; font-weight: 600; }
  .legend { font-size: 12px; }
  .note { font-size: 11px; }
</style>
<text class="title t1" x="16" y="28">Openergy vs Synergy on macOS</text>
<text class="sub t2" x="16" y="48">Recorded measurements on Apple silicon, macOS 27.2. Lower is better. 1 MiB = 1,024 KiB.</text>
<rect class="s-openergy" x="16" y="60" width="12" height="12" rx="3"/>
<text class="legend t1" x="34" y="70">Openergy 0.1 alpha</text>
<rect class="s-synergy" x="184" y="60" width="12" height="12" rx="3"/>
<text class="legend t1" x="202" y="70">Synergy 3.7 beta</text>
<text class="head t1" x="16" y="108">App bundle on disk (du -sk)</text>
<text class="cat t1" x="16" y="132.5">Openergy</text>
<path class="s-openergy" d="M108.00,118.00h4.91a4.00,4.00 0 0 1 4.00,4.00v12.00a4.00,4.00 0 0 1 -4.00,4.00h-4.91z"><title>Openergy 0.1 alpha: 9.1 MiB</title></path>
<text class="val t1" x="124.91" y="132.5">9.1 MiB</text>
<text class="cat t1" x="16" y="162.5">Synergy</text>
<path class="s-synergy" d="M108.00,148.00h512.00a4.00,4.00 0 0 1 4.00,4.00v12.00a4.00,4.00 0 0 1 -4.00,4.00h-512.00z"><title>Synergy 3.7 beta: 524.4 MiB</title></path>
<text class="val t1" x="632.00" y="162.5">524.4 MiB</text>
<line class="rule" x1="107.5" y1="114" x2="107.5" y2="172" stroke-width="1"/>
<text class="head t1" x="16" y="202">Idle memory (RSS), connected client</text>
<text class="cat t1" x="16" y="226.5">Openergy</text>
<path class="s-openergy" d="M108.00,212.00h226.43a4.00,4.00 0 0 1 4.00,4.00v12.00a4.00,4.00 0 0 1 -4.00,4.00h-226.43z"><title>Openergy 0.1 alpha: 64.5 MiB</title></path>
<text class="val t1" x="346.43" y="226.5">64.5 MiB</text>
<text class="cat t1" x="16" y="256.5">Synergy</text>
<path class="s-synergy" d="M108.00,242.00h512.00a4.00,4.00 0 0 1 4.00,4.00v12.00a4.00,4.00 0 0 1 -4.00,4.00h-512.00z"><title>Synergy 3.7 beta: 144.3 MiB</title></path>
<text class="val t1" x="632.00" y="256.5">144.3 MiB</text>
<line class="rule" x1="107.5" y1="208" x2="107.5" y2="266" stroke-width="1"/>
<text class="note t2" x="16" y="304">Same Mac (M5 Pro, macOS 27.2) and role: client of the same Windows server, windows closed.</text>
<text class="note t2" x="16" y="320">Memory: Synergy service + tray + core (2026-10-21); Openergy app + daemon (2026-10-25). Not a lab benchmark.</text>
</svg>
