[package]
name = "openergy-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
openergy-platform = { version = "0.1.0", path = "../platform" }
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
openergy-protocol = { version = "0.1.0", path = "../protocol" }
x11rb = { version = "=0.14.0", features = ["xinput", "xtest", "xfixes", "randr", "extra-traits", "screensaver", "xkb"] }
libc = "=0.2.191"

# Discovery example only. These are never linked into the production backend.
[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
serde_json.workspace = true
roxmltree = "=0.21.1"
