# Synthetic legacy configuration; no live host names or addresses.
section: screens
    studio-pc:
        halfDuplexCapsLock = false
        halfDuplexNumLock = true
        halfDuplexScrollLock = false
        shift = shift
        ctrl = super
        alt = alt
        altgr = alt
        meta = meta
        super = ctrl
        switchCorners = all -bottom-right
        switchCornerSize = 12
        xtestIsXineramaUnaware = false
        preserveFocus = true
    macbook:
end
section: aliases
    macbook:
        laptop
end
section: links
    studio-pc:
        left(20,80) = laptop(0,100)
    macbook:
        right = studio-pc(20,80)
end
section: options
    protocol = barrier
    address = 127.0.0.1:25020
    heartbeat = 3000
    relativeMouseMoves = true
    clipboardSharing = true
    clipboardSharingSize = 4000
    switchDelay = 150
    switchDoubleTap = 250
    switchCorners = none +top-left
    switchCornerSize = 8
    win32KeepForeground = true
    disableLockToScreen = false
    switchNeedsShift = false
    switchNeedsControl = false
    switchNeedsAlt = false
    defaultLockToScreenState = false
    keystroke(Control+Alt+l) = lockCursorToScreen(toggle)
    keystroke(Control+F12) = switchInDirection(left); keyUp(F12)
    mousebutton(4) = lockCursorToScreen(on)
    screenSaverSync = true
end
